apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-web
  labels:
    app: example-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example-web
  template:
    metadata:
      labels:
        app: example-web
    spec:
      containers:
        - name: web
          image: example-web:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: example-web
  labels:
    app: example-web
spec:
  selector:
    app: example-web
  ports:
    - port: 80
      targetPort: 80
